name: Validate and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node --test tests/release.test.js
      - run: pnpm audit --prod --registry=https://registry.npmjs.org
      - run: pnpm build
      - run: pnpm build:lib
      - run: pnpm verify:lib
      - run: pnpm test
      - run: pnpm test:ssr
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-diagnostics
          path: |
            artifacts/
            test-results/
          retention-days: 7

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm Trusted Publishing requires npm >=11.5.1; do not configure a token.
      - run: npm install --global npm@11
      # prepublishOnly runs verify:install, which launches Chromium against the real tarball.
      # Only Chromium is needed here; Firefox/WebKit are covered by the validation job.
      - run: pnpm exec playwright install --with-deps chromium
      # npm publish invokes prepublishOnly: real tarball consumers run with the new version.
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence
          path: artifacts/
          retention-days: 7
